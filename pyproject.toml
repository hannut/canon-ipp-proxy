[project]
name = "canon-ipp-proxy"
dynamic = ["version"]
description = "IPP fix-up proxy that lets CUPS use Canon printers with malformed IPP replies as driverless printers"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "hannut" }]
dependencies = []
keywords = ["cups", "ipp", "canon", "driverless", "airprint", "ipp-everywhere", "printer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Printing",
]

[project.urls]
Homepage = "https://github.com/hannut/canon-ipp-proxy"
Issues = "https://github.com/hannut/canon-ipp-proxy/issues"
Changelog = "https://github.com/hannut/canon-ipp-proxy/blob/main/CHANGELOG.md"

[project.scripts]
canon-ipp-proxy = "canon_ipp_proxy.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["canon_ipp_proxy"]

[tool.setuptools.dynamic]
version = { attr = "canon_ipp_proxy.__version__" }

[tool.ruff]
line-length = 120
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "E501"]
